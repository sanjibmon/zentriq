name: windows-release

# One job on a fresh GitHub-hosted Windows Server 2022 VM:
#   build -> unit + PostgreSQL integration tests -> package 1.0.0 and 1.0.1 -> install 1.0.0 silently and run
#   the acceptance suite (verify, restart, repair, backup, license rejection, upgrade to 1.0.1, uninstall,
#   reinstall) -> publish the installers as a GitHub pre-release (installers are ~500 MB each, too large for
#   the artifact quota) and upload the test reports as artifacts.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # create the pre-release with the installers

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  NUGET_XMLDOC_MODE: skip
  # Code signing (docs/code-signing.md). Leave the secrets unset to build unsigned.
  ZENTRIQ_AKV_URL: ${{ secrets.ZENTRIQ_AKV_URL }}
  ZENTRIQ_AKV_CERT: ${{ secrets.ZENTRIQ_AKV_CERT }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  ZQ_VERSION: '1.1.1'
  ZQ_UPGRADE_VERSION: '1.1.2'
  ZQ_PREVIOUS_RELEASE: 'v1.0.2-build.11'

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Prepare log folder
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/ci-logs" | Out-Null

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Start the runner's PostgreSQL for integration tests
        shell: pwsh
        run: |
          # GitHub Windows images include PostgreSQL (service disabled; user postgres / password root).
          # Used only by the database integration tests; stopped before the installer test.
          Get-ChildItem 'HKLM:\SOFTWARE\PostgreSQL\Installations' -ErrorAction SilentlyContinue | ForEach-Object { Get-ItemProperty $_.PSPath | Select-Object PSChildName, Version, 'Base Directory' | Format-List | Out-String | Write-Host }
          $svc = Get-Service -Name 'postgresql*' | Select-Object -First 1
          if (-not $svc) { Write-Warning 'No PostgreSQL on this runner; DB integration tests will be skipped.'; exit 0 }
          Set-Service $svc.Name -StartupType Manual
          Start-Service $svc.Name
          Write-Host "Started $($svc.Name)"
          "ZENTRIQ_TEST_PG=Host=localhost;Port=5432;Username=postgres;Password=root" | Out-File $env:GITHUB_ENV -Append
          "RUNNER_PG_SERVICE=$($svc.Name)" | Out-File $env:GITHUB_ENV -Append

      - name: Build
        shell: pwsh
        run: ./build.ps1 -Version $env:ZQ_VERSION *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/ci-logs/1-build.log"

      - name: Test
        shell: pwsh
        run: ./test.ps1 -NoBuild *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/ci-logs/2-test.log"

      - name: Package release
        shell: pwsh
        run: |
          ./package-windows.ps1 -Version $env:ZQ_VERSION -Build $env:GITHUB_RUN_NUMBER *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/ci-logs/3-package.log"
          Move-Item artifacts/release artifacts/release-main
          Get-Content artifacts/prereqs/prereqs.lock.json

      - name: Package the license server (vendor-hosted; not part of the customer installer)
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP/license-server"
          dotnet publish licensing/Zentriq.LicenseServer/Zentriq.LicenseServer.csproj -c Release -o $out "-p:Version=$($env:ZQ_VERSION)" --nologo *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/ci-logs/3b-license-server.log"
          if ($LASTEXITCODE -ne 0) { throw "license server publish failed" }
          Copy-Item licensing/Dockerfile, licensing/docker-compose.yml, licensing/env.example, docs/license-server.md $out
          $zip = "artifacts/release-main/Zentriq-LicenseServer-$($env:ZQ_VERSION).zip"
          Compress-Archive -Path "$out/*" -DestinationPath $zip
          $h = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Add-Content artifacts/release-main/SHA256SUMS.txt "$h  $(Split-Path $zip -Leaf)" -Encoding ascii

      - name: Package upgrade target
        shell: pwsh
        run: |
          ./package-windows.ps1 -Version $env:ZQ_UPGRADE_VERSION -Build $env:GITHUB_RUN_NUMBER *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/ci-logs/4-package-upgrade.log"
          Move-Item artifacts/release artifacts/release-upgrade

      - name: Free port 5432 (stop the runner's PostgreSQL)
        shell: pwsh
        run: |
          if ($env:RUNNER_PG_SERVICE) { Stop-Service $env:RUNNER_PG_SERVICE -Force; Set-Service $env:RUNNER_PG_SERVICE -StartupType Disabled }
          Get-NetTCPConnection -LocalPort 5432 -State Listen -ErrorAction SilentlyContinue | Format-Table | Out-String | Write-Host

      - name: Upgrade from the previous published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Customers on the last published build upgrade to this one; install it first, then upgrade, then clean up.
          gh release download $env:ZQ_PREVIOUS_RELEASE -R $env:GITHUB_REPOSITORY -p 'Zentriq-Setup-x64.exe' -D "$env:RUNNER_TEMP/previous"
          ./tests/installer/Invoke-UpgradeFromRelease.ps1 -OldBundle "$env:RUNNER_TEMP/previous/Zentriq-Setup-x64.exe" -NewBundle "$PWD/artifacts/release-main/Zentriq-Setup-x64.exe" -OutDir "$env:RUNNER_TEMP/acceptance-upgrade" *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/ci-logs/5a-upgrade-from-release.log"

      - name: Update the last published build of the same version in place
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Customers on an earlier build of the same version (e.g. 1.1.1.29) install this build: it must update the
          # existing server and agent in place, not install a second copy.
          $out = "$env:RUNNER_TEMP/acceptance-upgrade/same-version"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $tag = (gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=30" | ConvertFrom-Json | Where-Object { $_.tag_name -like "v$($env:ZQ_VERSION)-build.*" } | Select-Object -First 1).tag_name
          if (-not $tag) {
            "| S01 | Update an earlier $env:ZQ_VERSION build in place | **NOT RUN** | no earlier $env:ZQ_VERSION build has been published |" | Set-Content "$out/upgrade-results.md"
            exit 0
          }
          Write-Host "Previous build of the same version: $tag"
          gh release download $tag -R $env:GITHUB_REPOSITORY -p 'Zentriq-Setup-x64.exe' -p 'ZentriqAgent-x64.msi' -D "$env:RUNNER_TEMP/previous-same"
          ./tests/installer/Invoke-UpgradeFromRelease.ps1 -IdPrefix S -OldBundle "$env:RUNNER_TEMP/previous-same/Zentriq-Setup-x64.exe" -NewBundle "$PWD/artifacts/release-main/Zentriq-Setup-x64.exe" `
            -OldAgentMsi "$env:RUNNER_TEMP/previous-same/ZentriqAgent-x64.msi" -NewAgentMsi "$PWD/artifacts/release-main/ZentriqAgent-x64.msi" `
            -OutDir $out *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/ci-logs/5b-upgrade-same-version.log"

      - name: Update a half-updated server (build 27, then build 29 over it) in place
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Reproduces a customer server where build 29 was installed over build 27 before builds carried their own
          # version: the new build must replace both and every feature must work afterwards.
          $out = "$env:RUNNER_TEMP/acceptance-upgrade/half-updated"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          gh release download v1.1.1-build.27 -R $env:GITHUB_REPOSITORY -p 'Zentriq-Setup-x64.exe' -p 'ZentriqAgent-x64.msi' -D "$env:RUNNER_TEMP/v1.1.1-build.27"
          gh release download v1.1.1-build.29 -R $env:GITHUB_REPOSITORY -p 'Zentriq-Setup-x64.exe' -D "$env:RUNNER_TEMP/v1.1.1-build.29"
          ./tests/installer/Invoke-UpgradeFromRelease.ps1 -IdPrefix H -OldBundle "$env:RUNNER_TEMP/v1.1.1-build.27/Zentriq-Setup-x64.exe" -MiddleBundle "$env:RUNNER_TEMP/v1.1.1-build.29/Zentriq-Setup-x64.exe" `
            -NewBundle "$PWD/artifacts/release-main/Zentriq-Setup-x64.exe" `
            -OldAgentMsi "$env:RUNNER_TEMP/v1.1.1-build.27/ZentriqAgent-x64.msi" -NewAgentMsi "$PWD/artifacts/release-main/ZentriqAgent-x64.msi" `
            -OutDir $out *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/ci-logs/5c-upgrade-half-updated.log"

      - name: Installer acceptance suite
        shell: pwsh
        run: ./tests/installer/Invoke-InstallerAcceptance.ps1 -Bundle "$PWD/artifacts/release-main/Zentriq-Setup-x64.exe" -UpgradeBundle "$PWD/artifacts/release-upgrade/Zentriq-Setup-x64.exe" -OutDir "$env:RUNNER_TEMP/acceptance" *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/ci-logs/5-acceptance.log"

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          $md = Join-Path $env:RUNNER_TEMP 'acceptance/installer-test-results.md'
          if (Test-Path $md) { Get-Content $md | Out-File $env:GITHUB_STEP_SUMMARY -Append; Get-Content $md }
          $um = Join-Path $env:RUNNER_TEMP 'acceptance-upgrade/upgrade-results.md'
          if (Test-Path $um) { Get-Content $um | Out-File $env:GITHUB_STEP_SUMMARY -Append; Get-Content $um }
          foreach ($sub in 'same-version', 'half-updated') {
            $sm = Join-Path $env:RUNNER_TEMP "acceptance-upgrade/$sub/upgrade-results.md"
            if (Test-Path $sm) { Get-Content $sm | Out-File $env:GITHUB_STEP_SUMMARY -Append; Get-Content $sm }
          }
          $s = 'artifacts/test-results/summary.txt'
          if (Test-Path $s) { "`n**Unit/integration tests:** $(Get-Content $s)" | Out-File $env:GITHUB_STEP_SUMMARY -Append }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          retention-days: 14
          path: |
            artifacts/test-results
            ${{ runner.temp }}/acceptance
            artifacts/release-main/release-manifest.json
            artifacts/release-main/SHA256SUMS.txt
            artifacts/prereqs/prereqs.lock.json

      - name: Publish pre-release with installers
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$($env:ZQ_VERSION)-build.$($env:GITHUB_RUN_NUMBER)"
          Copy-Item "$env:RUNNER_TEMP/acceptance/installer-test-results.md" artifacts/release-main/
          Copy-Item artifacts/test-results/summary.txt artifacts/release-main/unit-test-summary.txt -ErrorAction SilentlyContinue
          $notes = "Automated build $($env:GITHUB_SHA). Unsigned unless a signing certificate is configured. Acceptance results attached (installer-test-results.md)."
          gh release create $tag --prerelease --title "Zentriq $($env:ZQ_VERSION) (build $($env:GITHUB_RUN_NUMBER))" --notes $notes --target $env:GITHUB_SHA (Get-ChildItem artifacts/release-main -File).FullName

      - name: Push logs and reports to the ci-logs branch
        if: always()
        shell: pwsh
        run: |
          # Logs/reports are also pushed to git so they can be read without access to the Actions log storage.
          $d = Join-Path $env:RUNNER_TEMP 'ci-logs-repo'
          New-Item -ItemType Directory -Force -Path $d | Out-Null
          Copy-Item "$env:RUNNER_TEMP/ci-logs/*" $d -ErrorAction SilentlyContinue
          if (Test-Path artifacts/test-results) { Copy-Item artifacts/test-results $d -Recurse }
          if (Test-Path "$env:RUNNER_TEMP/acceptance") { Copy-Item "$env:RUNNER_TEMP/acceptance" $d -Recurse -Exclude '*.zbak' }
          if (Test-Path "$env:RUNNER_TEMP/acceptance-upgrade") { Copy-Item "$env:RUNNER_TEMP/acceptance-upgrade" $d -Recurse -Exclude '*.zbak' }
          foreach ($f in 'artifacts/release-main/release-manifest.json', 'artifacts/release-main/SHA256SUMS.txt', 'artifacts/prereqs/prereqs.lock.json') { if (Test-Path $f) { Copy-Item $f $d } }
          Get-ChildItem installer -Recurse -Filter '*.log' -ErrorAction SilentlyContinue | Copy-Item -Destination $d
          "run $env:GITHUB_RUN_ID attempt $env:GITHUB_RUN_ATTEMPT commit $env:GITHUB_SHA job status ${{ job.status }}" | Set-Content (Join-Path $d 'RUN.txt')
          Push-Location $d
          git init -q -b ci-logs
          git config user.name 'zentriq-ci'; git config user.email 'ci@zentriq.invalid'
          git add -A; git commit -q -m "CI logs for run $env:GITHUB_RUN_ID"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs
          Pop-Location
