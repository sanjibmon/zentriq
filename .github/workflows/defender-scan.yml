# Microsoft Defender scan of a published release: every installer and every file inside them (bundle extracted with
# WiX, MSIs unpacked with an administrative install) on a clean Windows VM with current Defender signatures.
# Results (detections with file paths) go to branch ci-defender. Runs on pushes to defender/** branches.
name: defender-scan
on:
  push:
    branches: ['defender/**']
permissions:
  contents: write
jobs:
  scan:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: v1.1.1-build.143
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Scan the release with Microsoft Defender
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = "$env:RUNNER_TEMP\defender"; New-Item -ItemType Directory -Force $out | Out-Null
          $rel = "$env:RUNNER_TEMP\rel"; New-Item -ItemType Directory -Force $rel | Out-Null
          gh release download $env:RELEASE_TAG -R ${{ github.repository }} -p '*.exe' -p '*.msi' -p '*.zip' -D $rel
          Update-MpSignature -ErrorAction SilentlyContinue
          Get-MpComputerStatus | Select-Object AMProductVersion, AntivirusSignatureVersion, AntivirusSignatureLastUpdated, RealTimeProtectionEnabled | Format-List | Out-File "$out\defender-status.txt"
          # Unpack: bundle (WiX), MSIs (administrative install), zips.
          dotnet tool install --global wix --version 5.0.2 | Out-Null
          $x = "$env:RUNNER_TEMP\x"; New-Item -ItemType Directory -Force $x | Out-Null
          wix burn extract "$rel\Zentriq-Setup-x64.exe" -o "$x\bundle" 2>&1 | Out-File "$out\extract.log"
          foreach ($m in Get-ChildItem $rel -Filter *.msi) { Start-Process msiexec -ArgumentList '/a', "`"$($m.FullName)`"", '/qn', "TARGETDIR=`"$x\$($m.BaseName)`"" -Wait }
          foreach ($z in Get-ChildItem $rel -Filter *.zip) { Expand-Archive $z.FullName -DestinationPath "$x\$($z.BaseName)" -Force }
          Get-ChildItem $x -Recurse -File | Select-Object @{n='Path';e={$_.FullName.Substring($x.Length)}}, Length | Export-Csv "$out\files.csv" -NoTypeInformation
          $mp = Join-Path (Get-ChildItem 'C:\ProgramData\Microsoft\Windows Defender\Platform' | Sort-Object Name | Select-Object -Last 1).FullName 'MpCmdRun.exe'
          if (-not (Test-Path $mp)) { $mp = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe" }
          $report = @()
          foreach ($target in @(Get-ChildItem $rel -File) + @(Get-ChildItem $x -Directory)) {
            $log = & $mp -Scan -ScanType 3 -File $target.FullName -DisableRemediation 2>&1 | Out-String
            "===== $($target.Name)`n$log" | Out-File "$out\scan.log" -Append
            $report += "$($target.Name): exit $LASTEXITCODE"
          }
          $report | Out-File "$out\summary.txt"
          Get-MpThreatDetection | Select-Object ThreatID, ProcessName, @{n='Resources';e={$_.Resources -join '; '}}, InitialDetectionTime | Format-List | Out-File "$out\detections.txt"
          Get-MpThreat | Select-Object ThreatID, ThreatName, SeverityID, CategoryID | Format-List | Out-File "$out\threats.txt"
          Get-Content "$out\summary.txt", "$out\threats.txt", "$out\detections.txt"
      - name: Publish to branch ci-defender
        if: always()
        shell: pwsh
        run: |
          Set-Location "$env:RUNNER_TEMP\defender"
          git init -q -b ci-defender
          git config user.name 'zentriq-ci'; git config user.email 'ci@zentriq.invalid'
          git add -A; git commit -q -m "Defender scan of $env:RELEASE_TAG (run $env:GITHUB_RUN_ID)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-defender
