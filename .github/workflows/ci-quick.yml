name: ci-quick

# Fast feedback for work branches (dev/**): compile the server, run the unit and PostgreSQL integration tests on
# Linux, and type-check/build the web console. No installers, nothing published; main runs windows-release.

on:
  push:
    branches: ['dev/**']
  workflow_dispatch:

permissions:
  contents: write   # push the logs to the ci-quick-logs branch

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: root
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build server
        run: |
          set -o pipefail
          for p in Zentriq.Api Zentriq.Worker Zentriq.Setup Zentriq.Tests; do
            dotnet build backend/$p/$p.csproj -c Release 2>&1 | tee -a build.log
          done
          dotnet build agent/Zentriq.Agent/Zentriq.Agent.csproj -c Release 2>&1 | tee -a build.log
          dotnet build agent/Zentriq.Agent.Linux/Zentriq.Agent.Linux.csproj -c Release 2>&1 | tee -a build.log
          dotnet build licensing/Zentriq.LicenseServer.Tests/Zentriq.LicenseServer.Tests.csproj -c Release 2>&1 | tee -a build.log
      - name: Remote support engine (MeshCentral) for the live test
        run: |
          set -o pipefail
          v=$(node -p "require('./installer/remote/package.json').dependencies.meshcentral")
          log="$GITHUB_WORKSPACE/mesh.log"
          echo "MeshCentral $v" | tee "$log"
          npm view meshcentral dist-tags 2>&1 | tee -a "$log" || true
          mkdir -p "$RUNNER_TEMP/mc" && cd "$RUNNER_TEMP/mc" && npm init -y >/dev/null
          npm install "meshcentral@$v" --omit=dev --no-audit --no-fund --ignore-scripts 2>&1 | tail -40 | tee -a "$log"
          # Same trimmed agent set as the Windows installer (installer/remote/agents-keep.txt).
          keep=$(grep -v '^#' "$GITHUB_WORKSPACE/installer/remote/agents-keep.txt" | sed 's:/$::' | grep -v '^$')
          for f in node_modules/meshcentral/agents/* node_modules/meshcentral/agents/.[!.]*; do
            [ -e "$f" ] || continue
            echo "$keep" | grep -qxF "$(basename "$f")" || rm -rf "$f"
          done
          ls node_modules/meshcentral/agents | tee -a "$log"
          node "$GITHUB_WORKSPACE/installer/remote/brand.js" "$RUNNER_TEMP/mc" 2>&1 | tee -a "$log"
          echo "ZENTRIQ_TEST_MESHCENTRAL=$RUNNER_TEMP/mc" >> "$GITHUB_ENV"
      - name: SNMP agent simulator (snmpsim) for the live SNMP test
        run: |
          python3 -m pip install --user --break-system-packages --quiet snmpsim pysmi 2>&1 | tail -5 | tee snmp.log || true
          exe="$HOME/.local/bin/snmpsim-command-responder"
          if [ -x "$exe" ] && python3 -c "import snmpsim.commands.responder" 2>>snmp.log; then echo "ZENTRIQ_TEST_SNMPSIM=$exe" >> "$GITHUB_ENV"; "$exe" --version 2>&1 | head -3 | tee -a snmp.log || true; else echo "snmpsim not available" | tee -a snmp.log; fi
      - name: Tests (unit + PostgreSQL)
        env:
          ZENTRIQ_TEST_PG: Host=localhost;Port=5432;Username=postgres;Password=root
        run: |
          set -o pipefail
          dotnet test backend/Zentriq.Tests/Zentriq.Tests.csproj -c Release --no-build --logger "console;verbosity=normal" 2>&1 | tee test.log
      - name: License server tests (unit + PostgreSQL)
        if: always()
        env:
          ZENTRIQ_TEST_PG: Host=localhost;Port=5432;Username=postgres;Password=root
        run: |
          set -o pipefail
          dotnet test licensing/Zentriq.LicenseServer.Tests/Zentriq.LicenseServer.Tests.csproj -c Release --no-build --logger "console;verbosity=normal" 2>&1 | tee license-server-test.log
      - name: Linux agent packages (deb, rpm, tar.gz; x64 and ARM64)
        if: always()
        run: |
          set -o pipefail
          sudo apt-get install -y -qq rpm >/dev/null
          agent/linux/build-packages.sh "1.1.2.${GITHUB_RUN_NUMBER}" "$RUNNER_TEMP/linux-agent" x64 arm64 2>&1 | tee linux-agent-build.log
      - name: Linux agent on distributions (containers)
        if: always()
        run: |
          set -o pipefail
          tests/linux-agent/test-distros.sh "$RUNNER_TEMP/linux-agent" linux-agent-distros.md 2>&1 | tee linux-agent-distros.log
      - name: Linux application control (package-manager hooks)
        if: always()
        run: |
          set -o pipefail
          tests/linux-agent/test-app-control.sh "$RUNNER_TEMP/linux-agent" linux-app-control.md 2>&1 | tee linux-app-control.log
      - name: Web console
        if: always()
        working-directory: frontend
        run: |
          set -o pipefail
          npm install --no-audit --no-fund
          npm run build 2>&1 | tee build.log
      - name: Console screenshots (shell and add / edit windows)
        if: always()
        continue-on-error: true
        working-directory: frontend
        run: |
          set -o pipefail
          npx vite build -c vite.gallery.config.ts 2>&1 | tail -5
          npm install --no-save --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium > /dev/null
          node scripts/screens.mjs dist-gallery "$RUNNER_TEMP/screens" 2>&1 | tee screens.log
      - name: Push logs to the ci-quick-logs branch
        if: always()
        run: |
          d="$RUNNER_TEMP/logs"; mkdir -p "$d"
          cp build.log test.log license-server-test.log mesh.log snmp.log linux-agent-build.log linux-agent-distros.log linux-agent-distros.md linux-app-control.log linux-app-control.md "$d/" 2>/dev/null || true
          if [ -d "$RUNNER_TEMP/linux-agent/results" ]; then cp -r "$RUNNER_TEMP/linux-agent/results" "$d/linux-agent-results"; fi
          cp frontend/build.log "$d/console.log" 2>/dev/null || true
          if [ -d frontend/dist ]; then cp -r frontend/dist "$d/dist"; fi
          if [ -d "$RUNNER_TEMP/screens" ]; then cp -r "$RUNNER_TEMP/screens" "$d/screens"; cp frontend/screens.log "$d/" 2>/dev/null || true; fi
          echo "run $GITHUB_RUN_ID commit $GITHUB_SHA branch $GITHUB_REF_NAME status ${{ job.status }}" > "$d/RUN.txt"
          cd "$d" && git init -q && git checkout -q -b ci-quick-logs && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "ci-quick logs for run $GITHUB_RUN_ID"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-quick-logs
