name: ci-quick

# Fast feedback for work branches (dev/**): compile the server, run the unit and PostgreSQL integration tests on
# Linux, and type-check/build the web console. No installers, nothing published; main runs windows-release.

on:
  push:
    branches: ['dev/**']
  workflow_dispatch:

permissions:
  contents: write   # push the logs to the ci-quick-logs branch

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: root
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build server
        run: |
          set -o pipefail
          for p in Zentriq.Api Zentriq.Worker Zentriq.Setup Zentriq.Tests; do
            dotnet build backend/$p/$p.csproj -c Release 2>&1 | tee -a build.log
          done
          dotnet build agent/Zentriq.Agent/Zentriq.Agent.csproj -c Release 2>&1 | tee -a build.log
      - name: Remote support engine (MeshCentral) for the live test
        run: |
          set -o pipefail
          v=$(node -p "require('./installer/remote/package.json').dependencies.meshcentral")
          log="$GITHUB_WORKSPACE/mesh.log"
          echo "MeshCentral $v" | tee "$log"
          npm view meshcentral dist-tags 2>&1 | tee -a "$log" || true
          mkdir -p "$RUNNER_TEMP/mc" && cd "$RUNNER_TEMP/mc" && npm init -y >/dev/null
          npm install "meshcentral@$v" --omit=dev --no-audit --no-fund --ignore-scripts 2>&1 | tail -40 | tee -a "$log"
          # Same trimmed agent set as the Windows installer (installer/remote/agents-keep.txt).
          keep=$(grep -v '^#' "$GITHUB_WORKSPACE/installer/remote/agents-keep.txt" | sed 's:/$::' | grep -v '^$')
          for f in node_modules/meshcentral/agents/* node_modules/meshcentral/agents/.[!.]*; do
            [ -e "$f" ] || continue
            echo "$keep" | grep -qxF "$(basename "$f")" || rm -rf "$f"
          done
          ls node_modules/meshcentral/agents | tee -a "$log"
          echo "ZENTRIQ_TEST_MESHCENTRAL=$RUNNER_TEMP/mc" >> "$GITHUB_ENV"
      - name: Tests (unit + PostgreSQL)
        env:
          ZENTRIQ_TEST_PG: Host=localhost;Port=5432;Username=postgres;Password=root
        run: |
          set -o pipefail
          dotnet test backend/Zentriq.Tests/Zentriq.Tests.csproj -c Release --no-build --logger "console;verbosity=normal" 2>&1 | tee test.log
      - name: Web console
        if: always()
        working-directory: frontend
        run: |
          set -o pipefail
          npm install --no-audit --no-fund
          npm run build 2>&1 | tee build.log
      - name: Push logs to the ci-quick-logs branch
        if: always()
        run: |
          d="$RUNNER_TEMP/logs"; mkdir -p "$d"
          cp build.log test.log mesh.log "$d/" 2>/dev/null || true
          cp frontend/build.log "$d/console.log" 2>/dev/null || true
          if [ -d frontend/dist ]; then cp -r frontend/dist "$d/dist"; fi
          echo "run $GITHUB_RUN_ID commit $GITHUB_SHA branch $GITHUB_REF_NAME status ${{ job.status }}" > "$d/RUN.txt"
          cd "$d" && git init -q && git checkout -q -b ci-quick-logs && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "ci-quick logs for run $GITHUB_RUN_ID"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-quick-logs
