# Zentriq License Server: PostgreSQL + the service + Caddy (automatic HTTPS for the public name).
# See licensing/docs/license-server.md. In short:
#   1. Signing key (once, on this machine; keep an offline copy):
#        docker compose run --rm --no-deps -it license keygen --out /keys
#      copy keys/<id>.private.pem to secrets/signing.pem, put its passphrase (one line) into secrets/signing.passphrase,
#      and put <id> into ZLS_KEY_ID.
#   2. Copy env.example to .env, fill it in, then:  docker compose up -d
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: zentriq_license
      POSTGRES_USER: zentriq_license
      POSTGRES_PASSWORD: ${ZLS_DB_PASSWORD:?set ZLS_DB_PASSWORD in .env}
    volumes: [ "db:/var/lib/postgresql/data" ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zentriq_license"]
      interval: 5s
      retries: 20

  license:
    build: { context: .., dockerfile: licensing/Dockerfile }
    image: zentriq-license-server
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      ConnectionStrings__LicenseServer: Host=db;Database=zentriq_license;Username=zentriq_license;Password=${ZLS_DB_PASSWORD}
      LicenseServer__SigningKeyId: ${ZLS_KEY_ID:?set ZLS_KEY_ID in .env}
      LicenseServer__SigningKeyPassphraseFile: /run/secrets/zls_signing_passphrase
      LicenseServer__PublicUrl: https://${ZLS_HOSTNAME:?set ZLS_HOSTNAME in .env}
      LicenseServer__TrustAllProxies: "true"
      ZLS_BOOTSTRAP_EMAIL: ${ZLS_BOOTSTRAP_EMAIL:-}
      ZLS_ADMIN_PASSPHRASE: ${ZLS_ADMIN_PASSPHRASE:-}
    secrets: [ zls_signing_key, zls_signing_passphrase ]
    volumes: [ "./keys:/keys" ]

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [ license ]
    ports: [ "80:80", "443:443" ]
    command: caddy reverse-proxy --from ${ZLS_HOSTNAME} --to license:8080
    volumes: [ "caddy:/data" ]

secrets:
  zls_signing_key:
    file: ./secrets/signing.pem
  zls_signing_passphrase:
    file: ./secrets/signing.passphrase

volumes:
  db:
  caddy:
