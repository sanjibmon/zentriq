<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Zentriq mark: a "connected Z" — the diagonal is a link between two devices (nodes) and the
       dashed orbit stands for continuous discovery across the estate. -->
