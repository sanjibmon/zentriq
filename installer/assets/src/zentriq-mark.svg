  <path d="M16 18h28L20 46h28" fill="none" stroke="#FFFFFF" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="46" cy="18" r="6.5" fill="#5EE6F2"/>
  <circle cx="18" cy="46" r="6.5" fill="#5EE6F2"/>
</svg>
