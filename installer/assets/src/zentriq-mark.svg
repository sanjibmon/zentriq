    <linearGradient id="zq-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13A3B4"/>
      <stop offset="1" stop-color="#075468"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#zq-bg)"/>
  <path d="M32 9.5a22.5 22.5 0 0 1 22.5 22.5" fill="none" stroke="#9FEAF2" stroke-opacity=".55" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="1 5.2"/>
  <path d="M32 54.5A22.5 22.5 0 0 1 9.5 32" fill="none" stroke="#9FEAF2" stroke-opacity=".55" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="1 5.2"/>
