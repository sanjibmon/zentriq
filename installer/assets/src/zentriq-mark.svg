<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Zentriq mark: a bold "connected Z" — the diagonal links two devices (nodes). Flat colours, no fine detail,
       so it stays crisp from 16 px to 256 px. -->
